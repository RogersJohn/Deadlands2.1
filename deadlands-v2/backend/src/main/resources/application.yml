spring:
  application:
    name: deadlands-v2
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/deadlands}
    username: ${DATABASE_USERNAME:deadlands}
    password: ${DATABASE_PASSWORD:deadlands_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

jwt:
  # Base64 encoded secret key (at least 256 bits for HS256)
  # Generate with: echo -n "your-secret-key-here-must-be-at-least-32-characters" | base64
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktcGxlYXNlLWNoYW5nZS1pbi1wcm9kdWN0aW9uLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=}
  expiration: 86400000  # 24 hours (access token)
  refresh-expiration: 604800000  # 7 days (refresh token)

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    com.deadlands: DEBUG
    org.springframework.security: INFO
