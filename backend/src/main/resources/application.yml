server:
  port: 8080

spring:
  application:
    name: deadlands-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/deadlands
    username: ${DB_USERNAME:deadlands}
    password: ${DB_PASSWORD:deadlands}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.deadlands: DEBUG
    org.springframework.security: INFO
